<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <!-- Mobile responsive -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register — PerthPins</title>

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

  <!-- Custom styles -->
  <link rel="stylesheet" href="../static/css/common.css">
  <link rel="stylesheet" href="../static/css/login.css">
</head>

<body>

<!--
<div id="navbar-placeholder"></div>
-->
{% include "navbar.html" %}

<div class="auth-wrapper">
  <div class="auth-card">

    <h4 class="fw-bold mb-4">Register</h4>

      <!-- Display flashed messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <!-- Original prototype-only registration form without server
    <form id="register-form">
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Choose a username" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="you@example.com" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Enter password" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
               placeholder="Re-enter password" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <button type="submit" class="btn btn-pp w-100">Create Account</button>
    </form>
    -->

    <!-- Registration form with server-side processing -->
    <form id="register-form" method="post" action="{{ url_for('register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" id="username" name="username"
               placeholder="Choose a username" value="{{ form_data.username | default('') }}" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" class="form-control" id="email" name="email"
               placeholder="you@example.com" value="{{ form_data.email | default('') }}" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" id="password" name="password"
               placeholder="Enter password" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <!-- Password strength meter -->
      <div id="strength-wrap" class="mt-2" style="display:none;">
        <div class="progress" style="height:6px;">
          <div id="strength-bar" class="progress-bar" role="progressbar"
               style="width:0%;transition:width .3s ease;"
               aria-valuenow="0" aria-valuemin="0" aria-valuemax="100"></div>
        </div>
        <small id="strength-label" class="form-text fw-semibold mt-1 d-block"></small>
      </div> 
      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <input type="password" class="form-control" id="confirm_password" name="confirm_password"
               placeholder="Re-enter password" required />
        <div class="invalid-feedback">Required.</div>
      </div>
      <button type="submit" class="btn btn-pp w-100">Create Account</button>
    </form>

    <p class="text-center small text-muted mt-3 mb-0">
      <!--
      Already have an account? <a href="login.html" class="text-green">Log in</a>
      -->
      Already have an account? <a href="{{ url_for('login') }}" class="text-green">Log in</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../static/js/common.js"></script>
<!--
<script>loadComponent('navbar-placeholder', 'navbar.html');</script>
-->

</body>
<script>
(function () {
  var pwInput = document.getElementById('password');
  var bar     = document.getElementById('strength-bar');
  var label   = document.getElementById('strength-label');
  var wrap    = document.getElementById('strength-wrap');

  function score(pw) {
    var s = 0;
    if (pw.length >= 8)          s++;
    if (pw.length >= 12)         s++;
    if (/[A-Z]/.test(pw))        s++;
    if (/[0-9]/.test(pw))        s++;
    if (/[^A-Za-z0-9]/.test(pw)) s++;
    return s;
  }

  var levels = [
    { pct: 20,  cls: 'bg-danger',  text: 'Weak',   col: '#dc3545' },
    { pct: 40,  cls: 'bg-danger',  text: 'Weak',   col: '#dc3545' },
    { pct: 60,  cls: 'bg-warning', text: 'Fair',   col: '#ffc107' },
    { pct: 80,  cls: 'bg-info',    text: 'Good',   col: '#0dcaf0' },
    { pct: 100, cls: 'bg-success', text: 'Strong', col: '#198754' },
  ];

  pwInput.addEventListener('input', function () {
    var pw = pwInput.value;
    wrap.style.display = pw.length ? 'block' : 'none';
    if (!pw.length) return;
    var lvl = levels[Math.max(score(pw) - 1, 0)];
    bar.style.width   = lvl.pct + '%';
    bar.className     = 'progress-bar ' + lvl.cls;
    label.textContent = 'Strength: ' + lvl.text;
    label.style.color = lvl.col;
  });
})();
</script>    
</html>
